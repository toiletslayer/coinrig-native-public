name: Validate COINrig HiveOS integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shell callbacks
        run: |
          bash -n coinrig-native/h-config.sh
          bash -n coinrig-native/h-run.sh
          bash -n coinrig-native/h-stats.sh
      - name: Python compile checks
        run: python -m compileall -q coinrig-native scripts tests
      - name: Offline fake-miner tests
        run: python -m unittest discover -s tests -v
